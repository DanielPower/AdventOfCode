# Single-file solutions compiled with rustc.
language = "rust"
image = "docker.io/library/rust:1.82.0-slim@sha256:1111c28d995d06a7863ba6cea3b3dcb87bebe65af8ec5517caaf2c8c26f38010"
discover = "{dd}/{part}.rs"
build = "mkdir -p {cache}/bin && rustc -O --edition 2018 -o {cache}/bin/{dd}-{part} {dd}/{part}.rs"
run = "{cache}/bin/{dd}-{part}"
sources = "{dd}/{part}.rs"

# `cargo aoc new YEAR DAY [PART]` copies template/, expanding {{year}} {{day}} {{dd}} {{part}}.
[new]
template = "template"

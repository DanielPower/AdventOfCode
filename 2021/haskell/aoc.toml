# One stack project; Main dispatches on `day part`. The toolchain image
# (Dockerfile) bakes in GHC 8.10.7 and the lts-18.18 dependencies.
language = "haskell"
dockerfile = "Dockerfile"
discover = "src/Day{day}.hs"
build = "stack build --copy-bins --local-bin-path {cache}/bin"
run = "{cache}/bin/AdventOfCode2021Haskell-exe {day} {part}"
